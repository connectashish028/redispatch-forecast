name: Daily SHN data refresh

# Runs once a day, fetches new redispatch ops from Connect+, rebuilds the
# processed parquets, and pushes back to main. Streamlit Cloud picks up the
# push and redeploys automatically.

on:
  schedule:
    # 04:30 UTC every day = 06:30 CEST in summer / 05:30 CET in winter,
    # which is right after most early-morning ops are published and well
    # before any working-hours visitors hit the dashboard.
    - cron: '30 4 * * *'
  workflow_dispatch:        # also lets you trigger manually from the Actions tab

permissions:
  contents: write           # the job pushes commits back to the repo

concurrency:
  group: refresh-data
  cancel-in-progress: false # never cancel a running refresh; let it finish

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # default fetch-depth=1 is fine — we don't need the full git history
          # for either fetch or rebuild
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Adds lightgbm + scikit-learn + joblib for the scoring step;
          # keeps install slim (no streamlit / plotly — those are dashboard-only).
          pip install pandas numpy pyarrow requests lightgbm scikit-learn joblib

      - name: Fetch new SHN ops
        run: python src/fetch_shn_ops.py --max-chunks 25

      - name: Refresh SMARD + weather cache
        run: python src/fetcher.py
        continue-on-error: true        # don't block ops/timeseries on a flaky upstream

      - name: Rebuild processed parquets
        run: python src/build_timeseries.py

      - name: Rebuild features
        run: python src/v2/build_features.py
        continue-on-error: true        # train/serve schema changes shouldn't break daily refresh

      - name: Score today + write contributions
        id: score
        run: |
          # The most recent fully-coverable date is the latest ts in
          # features.parquet, which already accounts for the 24h cooldown.
          DATE=$(python - <<'PY'
          import pandas as pd
          ts = pd.read_parquet('data/processed/features.parquet', columns=['ts'])['ts']
          print(ts.max().date())
          PY
          )
          echo "Scoring $DATE"
          python src/v2/score_today.py --date "$DATE" --quiet
          echo "scored_date=$DATE" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Update daily attribution summary
        if: steps.score.outcome == 'success'
        run: |
          python src/build_daily_summary.py --append-date "${{ steps.score.outputs.scored_date }}"

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/shn_operations_last_2y/chunk_*.parquet \
                  data/processed/ts_15min_wide.parquet \
                  data/processed/ts_15min_long.parquet \
                  data/predictions/contributions_daily_summary.parquet \
                  || true

          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
          else
            git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
            git push
            echo "Pushed daily refresh."
          fi
