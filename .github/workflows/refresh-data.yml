name: Daily SHN data refresh

# Runs once a day, fetches new redispatch ops from Connect+, rebuilds the
# processed parquets, and pushes back to main. Streamlit Cloud picks up the
# push and redeploys automatically.

on:
  schedule:
    # 04:30 UTC every day = 06:30 CEST in summer / 05:30 CET in winter,
    # which is right after most early-morning ops are published and well
    # before any working-hours visitors hit the dashboard.
    - cron: '30 4 * * *'
  workflow_dispatch:        # also lets you trigger manually from the Actions tab

permissions:
  contents: write           # the job pushes commits back to the repo

concurrency:
  group: refresh-data
  cancel-in-progress: false # never cancel a running refresh; let it finish

jobs:
  refresh:
    runs-on: ubuntu-latest
    # build_timeseries.py rebuilds the 15-min activity matrix from all
    # ~2,000 daily SHN chunks every run; on the 7 GB hosted runner the
    # 4.3M-row pivot takes ~25 min (vs ~30s locally on a 16 GB laptop).
    # build_features.py adds another few minutes; score + summary are
    # fast. 60 minutes leaves headroom for genuine SHN refresh days
    # without false-positive cancels.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # default fetch-depth=1 is fine — we don't need the full git history
          # for either fetch or rebuild
          fetch-depth: 1

      - name: Sanity-check the checkout
        # Two earlier runs found '[fetcher] no cache' even though the cache
        # file is committed on origin. This step prints a quick inventory so
        # we can see exactly what the runner has, which file is missing if
        # any, and stops the workflow early if a critical asset is absent
        # (saves the 15-min full SMARD refetch).
        run: |
          echo "--- pwd / commit ---"
          pwd
          git rev-parse HEAD
          echo "--- data/external/ ---"
          ls -la data/external/ || echo "DIR MISSING"
          echo "--- data/raw/shn_operations_last_2y/ (first 5) ---"
          ls -la data/raw/shn_operations_last_2y/ 2>/dev/null | head -8
          echo "--- chunks total ---"
          ls data/raw/shn_operations_last_2y/ 2>/dev/null | wc -l
          echo "--- models/ ---"
          ls -la models/ 2>/dev/null || echo "DIR MISSING"
          echo "--- daily summary ---"
          ls -la data/predictions/ 2>/dev/null || echo "DIR MISSING"
          echo "--- critical-file presence check ---"
          missing=0
          for f in \
            data/external/smard_weather_2024_to_mar2026.parquet \
            data/external/towns_geo.parquet \
            data/external/shn_grid.geojson \
            data/processed/ts_15min_wide.parquet \
            models/feature_cols.json \
            models/model_y_24h.txt; do
            if [ -f "$f" ]; then
              echo "  PRESENT  $f  ($(stat -c%s "$f") bytes)"
            else
              echo "  MISSING  $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "ERROR: $missing critical file(s) missing from the runner workspace."
            echo "These files ARE tracked on origin/main; their absence here points"
            echo "to a checkout / .gitignore / sparse-checkout problem rather than"
            echo "a real data issue. Failing fast to avoid a 15-min full refetch."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Adds lightgbm + scikit-learn + joblib for the scoring step;
          # keeps install slim (no streamlit / plotly — those are dashboard-only).
          # `holidays` is required by build_features.py for is_de_holiday;
          # missing it silently degrades predictions (the feature falls back
          # to 0 for every row). sklearn pinned to match training-time version
          # so isotonic calibrators unpickle without warnings.
          pip install pandas numpy pyarrow requests lightgbm \
                      "scikit-learn>=1.6,<1.7" joblib holidays

      - name: Fetch new SHN ops
        # SHN's Connect+ API has had connectivity outages on top of its
        # publication freeze. Don't block downstream steps if the API is
        # unreachable — build_timeseries / score_today / summary should
        # still run against the already-committed parquets.
        run: python src/fetch_shn_ops.py --max-chunks 25
        continue-on-error: true

      - name: Refresh SMARD + weather cache
        run: python src/fetcher.py
        continue-on-error: true        # don't block ops/timeseries on a flaky upstream

      - name: Rebuild processed parquets
        run: python src/build_timeseries.py

      - name: Rebuild features
        run: python src/v2/build_features.py
        continue-on-error: true        # train/serve schema changes shouldn't break daily refresh

      - name: Score today + write contributions
        id: score
        run: |
          # The most recent fully-coverable date is the latest ts in
          # features.parquet, which already accounts for the 24h cooldown.
          DATE=$(python - <<'PY'
          import pandas as pd
          ts = pd.read_parquet('data/processed/features.parquet', columns=['ts'])['ts']
          print(ts.max().date())
          PY
          )
          echo "Scoring $DATE"
          python src/v2/score_today.py --date "$DATE" --quiet
          echo "scored_date=$DATE" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Update daily attribution summary
        if: steps.score.outcome == 'success'
        run: |
          python src/build_daily_summary.py --append-date "${{ steps.score.outputs.scored_date }}"

      - name: Commit and push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/raw/shn_operations_last_2y/chunk_*.parquet \
                  data/external/smard_weather_2024_to_mar2026.parquet \
                  data/processed/ts_15min_wide.parquet \
                  data/processed/ts_15min_long.parquet \
                  data/predictions/contributions_daily_summary.parquet \
                  || true

          if git diff --cached --quiet; then
            echo "No data changes — nothing to commit."
            exit 0
          fi

          git commit -m "Daily refresh $(date -u +%Y-%m-%d)"

          # Rebase onto any commits that landed on main while the runner was
          # building features / scoring (typical when humans push during the
          # ~5-15 min window). Retry the push a couple of times in case of
          # genuine concurrent activity.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { echo "rebase failed on attempt $attempt"; git rebase --abort; exit 1; }
            if git push; then
              echo "Pushed daily refresh on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt; retrying after rebase."
          done
          echo "All push attempts failed."
          exit 1
